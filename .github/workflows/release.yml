name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: gaze-hermes-sidecar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: gaze-hermes-sidecar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: gaze-hermes-sidecar
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: gaze-hermes-sidecar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: gaze-hermes-sidecar.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            sidecar/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --locked --release --manifest-path sidecar/Cargo.toml --target ${{ matrix.target }}

      - name: Create dist directory
        run: mkdir -p dist

      - name: Copy artifact
        run: |
          cp sidecar/target/${{ matrix.target }}/release/${{ matrix.artifact }} dist/${{ matrix.artifact }}-${{ matrix.target }}

      - name: Hash artifact
        run: sha256sum "dist/${{ matrix.artifact }}-${{ matrix.target }}" > "dist/${{ matrix.artifact }}-${{ matrix.target }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.target }}
          path: |
            dist/${{ matrix.artifact }}-${{ matrix.target }}
            dist/${{ matrix.artifact }}-${{ matrix.target }}.sha256

  docker-image:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gaze-hermes/sidecar
          tags: |
            type=ref,event=tag
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-manifest:
    needs: [build-and-release, docker-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update sidecar manifest
        run: >
          python scripts/update-sidecar-manifest.py
          --protocol-version 1
          --artifacts-dir dist
          --output sidecar-release.json

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-release.json
          path: sidecar-release.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
            sidecar-release.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}