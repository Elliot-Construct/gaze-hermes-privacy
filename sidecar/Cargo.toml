[package]
name = "gaze-hermes-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Local Gaze privacy sidecar for Hermes"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
subtle = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gaze = { package = "gaze-pii", version = "=0.14.0" }
gaze-assembly = "=0.14.0"
gaze-recognizers = "=0.14.0"
gaze-model-setup = "=0.14.0"
toml = "0.9"
toml_edit = "0.23"
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand = { version = "0.9", features = ["os_rng"] }
hex = "0.4"
zeroize = "1.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
