[project]
name = "gaze-hermes-privacy"
version = "0.1.0"
description = "Reversible PII protection for Hermes external LLM calls via a local Gaze sidecar"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "websockets>=12"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["gaze_privacy*"]